<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FashionVault — Admin Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="stores.js"></script>
  <style>
    :root {
      --bg: #f5f2eb;
      --card-bg: #eae6dd;
      --accent: #c84b2c;
      --text: #222;
      --muted: #666;
      --border: #dcd6cd;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 30px; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
    h1 { font-family: serif; font-size: 2.2rem; }
    .nav-btn { background: var(--text); color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 0.9rem; margin-left: 10px; }
    .nav-btn.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }

    /* Overview Cards */
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .card { background: var(--card-bg); padding: 20px; border-radius: 8px; border: 1px solid var(--border); }
    .card h3 { font-size: 2.5rem; color: var(--text); margin-bottom: 5px; }
    .card p { font-size: 0.8rem; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

    /* Section Styles */
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    h2 { font-family: serif; font-size: 1.5rem; margin-bottom: 15px; }
    
    /* Layout split */
    .split-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 30px; margin-bottom: 40px; }

    /* Tables */
    .table-container { background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border); overflow-x: auto; margin-bottom: 40px; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    th { background: #dfd9ce; padding: 12px 16px; font-weight: 600; font-size: 0.8rem; color: var(--muted); text-transform: uppercase; }
    td { padding: 14px 16px; border-top: 1px solid var(--border); }

    /* Forms */
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 0.85rem; margin-bottom: 5px; color: var(--muted); }
    input, select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 4px; background: #fff; font-size: 0.9rem; }
    .btn-submit { width: 100%; background: var(--accent); color: white; border: none; padding: 12px; border-radius: 4px; font-weight: 600; cursor: pointer; margin-top: 10px; }

    /* Search Input */
    .search-input { width: 250px; }
    .badge { padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
    .badge-admin { background: #222; color: #fff; }
    .badge-user { background: #dcd6cd; color: #333; }

    /* Login Block */
    #loginModal { max-width: 400px; margin: 80px auto; background: var(--card-bg); padding: 30px; border-radius: 8px; border: 1px solid var(--border); }
    #loginModal h2 { text-align: center; margin-bottom: 20px; font-family: serif; }
    .error { color: var(--accent); font-size: 0.85rem; margin-top: 10px; text-align: center; font-weight: 600; }
  </style>
</head>
<body>

  <!-- 1. SIGN IN SCREEN -->
  <div id="loginModal">
    <h2>Admin Sign In</h2>
    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" required placeholder="ameynair377@gmail.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn-submit">Sign In</button>
    </form>
    <div id="loginError" class="error"></div>
  </div>

  <!-- 2. PROTECTED ADMIN DASHBOARD -->
  <div id="dashboard" style="display:none;">
    <header>
      <div>
        <h1>FashionVault</h1>
        <p style="font-size:0.85rem; color:var(--accent);">ADMIN PANEL</p>
      </div>
      <div>
        <a href="index.html" class="nav-btn secondary">View Site</a>
        <button onclick="handleLogout()" class="nav-btn">Sign Out</button>
      </div>
    </header>

    <!-- OVERVIEW STATS -->
    <h2>Overview</h2>
    <div class="grid-4">
      <div class="card"><h3 id="statTotalUsers">0</h3><p>Total Sign-Ups</p></div>
      <div class="card"><h3 id="statNewUsers">0</h3><p>New (7 Days)</p></div>
      <div class="card"><h3 id="statTotalStores">0</h3><p>Total Stores</p></div>
      <div class="card"><h3 id="statFavorites">0</h3><p>Favorites Saved</p></div>
    </div>

    <div class="split-grid">
      <!-- STORE MANAGEMENT -->
      <div>
        <div class="section-header">
          <h2>Store Directory (A - Z)</h2>
        </div>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Alphabet Group</th>
                <th>URL</th>
              </tr>
            </thead>
            <tbody id="storesTableBody">
              <tr><td colspan="3" style="text-align:center; padding:20px;">Loading stores...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- ADD STORE FORM -->
      <div>
        <h2>Add New Store</h2>
        <div class="card">
          <form onsubmit="handleAddStore(event)">
            <div class="form-group">
              <label>Store Name</label>
              <input type="text" id="storeName" required placeholder="e.g., FashionHub">
            </div>
            <div class="form-group">
              <label>Alphabet Group (A-Z Index)</label>
              <select id="alphabetGroup">
                <option value="A">A</option><option value="B">B</option><option value="C">C</option>
                <option value="D">D</option><option value="E">E</option><option value="F">F</option>
                <option value="G">G</option><option value="H">H</option><option value="I">I</option>
                <option value="J">J</option><option value="K">K</option><option value="L">L</option>
                <option value="M">M</option><option value="N">N</option><option value="O">O</option>
                <option value="P">P</option><option value="Q">Q</option><option value="R">R</option>
                <option value="S">S</option><option value="T">T</option><option value="U">U</option>
                <option value="V">V</option><option value="W">W</option><option value="X">X</option>
                <option value="Y">Y</option><option value="Z">Z</option>
              </select>
            </div>
            <div class="form-group">
              <label>Website URL</label>
              <input type="url" id="storeUrl" required placeholder="https://example.com">
            </div>
            <button type="submit" class="btn-submit">Generate Store Entry</button>
          </form>
        </div>
      </div>
    </div>

    <!-- MEMBERS LIST -->
    <div class="section-header">
      <h2>Members Directory</h2>
      <input type="text" class="search-input" id="memberSearch" onkeyup="filterMembers()" placeholder="Search by name or email...">
    </div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Joined</th>
          </tr>
        </thead>
        <tbody id="membersTableBody">
          <tr><td colspan="4" style="text-align:center; padding:20px;">Loading members...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const url = window.SUPABASE_URL || (typeof FASHIONVAULT_CONFIG !== 'undefined' ? FASHIONVAULT_CONFIG.supabaseUrl : '');
    const key = window.SUPABASE_ANON_KEY || (typeof FASHIONVAULT_CONFIG !== 'undefined' ? FASHIONVAULT_CONFIG.supabaseAnonKey : '');
    const supabaseClient = supabase.createClient(url, key);

    let membersData = [];

    async function checkAdminSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        document.getElementById('loginModal').style.display = 'block';
        document.getElementById('dashboard').style.display = 'none';
        return;
      }

      const { data: profile } = await supabaseClient
        .from('profiles')
        .select('is_admin')
        .eq('id', session.user.id)
        .maybeSingle();

      if (profile && profile.is_admin) {
        document.getElementById('loginModal').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        loadDashboardData();
      } else {
        document.getElementById('loginModal').style.display = 'block';
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('loginError').innerText = 'Access Denied: Your account is not an admin.';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const errDiv = document.getElementById('loginError');

      errDiv.innerText = "Signing in...";

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        errDiv.innerText = error.message;
      } else {
        errDiv.innerText = "";
        checkAdminSession();
      }
    }

    async function handleLogout() {
      await supabaseClient.auth.signOut();
      window.location.reload();
    }

    async function loadDashboardData() {
      const { data: profiles } = await supabaseClient.from('profiles').select('*');
      membersData = profiles || [];
      renderMembers(membersData);

      document.getElementById('statTotalUsers').innerText = membersData.length;
      
      const sevenDaysAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
      const newUsers = membersData.filter(m => new Date(m.created_at) > sevenDaysAgo);
      document.getElementById('statNewUsers').innerText = newUsers.length;

      const { count: favCount } = await supabaseClient.from('favorites').select('*', { count: 'exact', head: true });
      document.getElementById('statFavorites').innerText = favCount || 0;

      loadStoresFromJS();
    }

    function loadStoresFromJS() {
      const storesList = (typeof STORES !== 'undefined') ? STORES : [];
      storesList.sort((a, b) => a.name.localeCompare(b.name));

      document.getElementById('statTotalStores').innerText = storesList.length;
      const tbody = document.getElementById('storesTableBody');

      if (storesList.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding:20px;">No stores found in stores.js</td></tr>';
        return;
      }

      tbody.innerHTML = storesList.map(store => `
        <tr>
          <td><strong>${store.name}</strong></td>
          <td><span class="badge badge-admin">${store.alphabetGroup || '—'}</span></td>
          <td><a href="${store.url}" target="_blank" style="color:var(--accent);">${store.url}</a></td>
        </tr>
      `).join('');
    }

    function handleAddStore(e) {
      e.preventDefault();
      const name = document.getElementById('storeName').value;
      const url = document.getElementById('storeUrl').value;
      const alphabetGroup = document.getElementById('alphabetGroup').value;

      const snippet = `  { id: "${name.toLowerCase().replace(/[^a-z0-9]/g, '-')}", name: "${name}", url: "${url}", alphabetGroup: "${alphabetGroup}" },`;
      
      prompt("Copy this line and paste it into your stores.js file:", snippet);
      
      document.getElementById('storeName').value = '';
      document.getElementById('storeUrl').value = '';
    }

    function renderMembers(list) {
      const tbody = document.getElementById('membersTableBody');
      tbody.innerHTML = list.map(m => `
        <tr>
          <td>${m.name || '—'}</td>
          <td>${m.email}</td>
          <td><span class="badge ${m.is_admin ? 'badge-admin' : 'badge-user'}">${m.is_admin ? 'Admin' : 'User'}</span></td>
          <td>${new Date(m.created_at).toLocaleDateString()}</td>
        </tr>
      `).join('');
    }

    function filterMembers() {
      const q = document.getElementById('memberSearch').value.toLowerCase();
      const filtered = membersData.filter(m => 
        (m.name && m.name.toLowerCase().includes(q)) || 
        (m.email && m.email.toLowerCase().includes(q))
      );
      renderMembers(filtered);
    }

    checkAdminSession();
  </script>
</body>
</html>
