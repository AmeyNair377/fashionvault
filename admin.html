<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <!-- Strict policy: only our own files plus the one pinned Supabase script may run. No inline scripts. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>FashionVault — Admin Panel</title>
  <style>
    :root { --bg:#f5f2eb; --card-bg:#eae6dd; --accent:#c84b2c; --text:#222; --muted:#666; --border:#dcd6cd; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    body { background:var(--bg); color:var(--text); padding:30px; }
    [hidden] { display:none !important; }
    header { display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; border-bottom:1px solid var(--border); padding-bottom:15px; }
    h1 { font-family:serif; font-size:2.2rem; }
    .tag { font-size:.85rem; color:var(--accent); }
    .nav-btn { background:var(--text); color:#fff; border:none; padding:8px 16px; border-radius:4px; cursor:pointer; text-decoration:none; font-size:.9rem; margin-left:10px; }
    .nav-btn.secondary { background:transparent; color:var(--text); border:1px solid var(--border); }
    .grid-4 { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:20px; margin-bottom:40px; }
    .card { background:var(--card-bg); padding:20px; border-radius:8px; border:1px solid var(--border); }
    .card h3 { font-size:2.5rem; margin-bottom:5px; }
    .card p.label { font-size:.8rem; color:var(--accent); font-weight:600; text-transform:uppercase; letter-spacing:.5px; }
    .section-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; }
    h2 { font-family:serif; font-size:1.5rem; margin-bottom:15px; }
    .split-grid { display:grid; grid-template-columns:2fr 1fr; gap:30px; margin-bottom:40px; }
    @media (max-width:800px){ .split-grid{grid-template-columns:1fr;} body{padding:16px;} }
    .table-container { background:var(--card-bg); border-radius:8px; border:1px solid var(--border); overflow-x:auto; margin-bottom:40px; }
    table { width:100%; border-collapse:collapse; text-align:left; font-size:.9rem; }
    th { background:#dfd9ce; padding:12px 16px; font-weight:600; font-size:.8rem; color:var(--muted); text-transform:uppercase; }
    td { padding:14px 16px; border-top:1px solid var(--border); }
    td.empty { text-align:center; padding:20px; }
    td a { color:var(--accent); }
    .form-group { margin-bottom:15px; }
    label { display:block; font-size:.85rem; margin-bottom:5px; color:var(--muted); }
    input, select, textarea { width:100%; padding:10px; border:1px solid var(--border); border-radius:4px; background:#fff; font-size:.9rem; }
    .btn-submit { width:100%; background:var(--accent); color:#fff; border:none; padding:12px; border-radius:4px; font-weight:600; cursor:pointer; margin-top:10px; }
    .btn-submit:disabled { opacity:.6; cursor:not-allowed; }
    .search-input { width:250px; }
    .badge { padding:3px 8px; border-radius:4px; font-size:.75rem; font-weight:bold; }
    .badge-admin { background:#222; color:#fff; }
    .badge-user { background:#dcd6cd; color:#333; }
    #loginModal { max-width:400px; margin:80px auto; background:var(--card-bg); padding:30px; border-radius:8px; border:1px solid var(--border); }
    #loginModal h2 { text-align:center; margin-bottom:20px; }
    .error { color:var(--accent); font-size:.85rem; margin-top:10px; text-align:center; font-weight:600; min-height:1em; }
    .snippet-box { margin-top:14px; }
    .snippet-box textarea { font-family:ui-monospace,Consolas,monospace; font-size:.8rem; height:90px; }
    .hint { font-size:.78rem; color:var(--muted); margin-top:6px; }
  </style>
</head>
<body>

  <!-- 1. SIGN IN -->
  <div id="loginModal" hidden>
    <h2>Admin Sign In</h2>
    <form id="loginForm" autocomplete="on">
      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" required autocomplete="username" maxlength="254">
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" required autocomplete="current-password" maxlength="72">
      </div>
      <button type="submit" id="loginBtn" class="btn-submit">Sign In</button>
    </form>
    <div id="loginError" class="error" role="alert"></div>
  </div>

  <!-- 2. DASHBOARD (only shown after the server confirms this account is an admin) -->
  <div id="dashboard" hidden>
    <header>
      <div>
        <h1>FashionVault</h1>
        <p class="tag">ADMIN PANEL</p>
      </div>
      <div>
        <a href="index.html" class="nav-btn secondary">View Site</a>
        <button id="logoutBtn" type="button" class="nav-btn">Sign Out</button>
      </div>
    </header>

    <h2>Overview</h2>
    <div class="grid-4">
      <div class="card"><h3 id="statTotalUsers">0</h3><p class="label">Total Sign-Ups</p></div>
      <div class="card"><h3 id="statNewUsers">0</h3><p class="label">New (7 Days)</p></div>
      <div class="card"><h3 id="statTotalStores">0</h3><p class="label">Total Stores</p></div>
      <div class="card"><h3 id="statFavorites">0</h3><p class="label">Favorites Saved</p></div>
    </div>

    <div class="split-grid">
      <div>
        <div class="section-header"><h2>Store Directory (A - Z)</h2></div>
        <div class="table-container">
          <table>
            <thead><tr><th>Name</th><th>Alphabet Group</th><th>URL</th></tr></thead>
            <tbody id="storesTableBody"><tr><td colspan="3" class="empty">Loading stores...</td></tr></tbody>
          </table>
        </div>
      </div>

      <div>
        <h2>Add New Store</h2>
        <div class="card">
          <form id="addStoreForm">
            <div class="form-group">
              <label for="storeName">Store Name</label>
              <input type="text" id="storeName" required maxlength="60" placeholder="e.g. Mumbai Culture Cafe">
            </div>
            <div class="form-group">
              <label for="alphabetGroup">Alphabet Group (A-Z Index)</label>
              <select id="alphabetGroup"></select>
            </div>
            <div class="form-group">
              <label for="storeUrl">Website URL</label>
              <input type="url" id="storeUrl" required maxlength="200" placeholder="https://example.com">
            </div>
            <button type="submit" class="btn-submit">Generate Store Entry</button>
          </form>
          <div id="snippetBox" class="snippet-box" hidden>
            <label for="snippetOut">Paste this line into stores.js:</label>
            <textarea id="snippetOut" readonly></textarea>
            <button id="copySnippet" type="button" class="nav-btn">Copy</button>
            <p class="hint" id="snippetMsg"></p>
          </div>
        </div>
      </div>
    </div>

    <div class="section-header">
      <h2>Members Directory</h2>
      <input type="search" class="search-input" id="memberSearch" maxlength="80" placeholder="Search by name or email...">
    </div>
    <div class="table-container">
      <table>
        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th></tr></thead>
        <tbody id="membersTableBody"><tr><td colspan="4" class="empty">Loading members...</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- Supabase library pinned to an exact version and verified with an integrity hash -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"
          integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP"
          crossorigin="anonymous"></script>
  <script src="config.js"></script>
  <script src="stores.js"></script>
  <script src="admin.js"></script>
</body>
</html>
