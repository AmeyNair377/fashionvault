<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin Panel · FashionVault</title>
<style>
  :root {
    --paper: #f1ede3;
    --paper-deep: #e5dce3;
    --ink: #222822;
    --muted: #60062a;
    --red: #bd4327;
    --red-dark: #8c2411;
    --serif: "Iowan Old Style", Georgia, serif;
    --sans: "Avenir Next", "Segoe UI", sans-serif;
    --mono: "SFMono-Regular", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: 1rem; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.5;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 24px 64px; }

  header.top {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding: 28px 0 20px; border-bottom: 1px solid var(--ink);
    margin-bottom: 40px;
  }
  header.top h1 { font-family: var(--serif); font-size: 1.9rem; font-weight: 400; margin: 0; }
  header.top nav { display: flex; align-items: center; gap: 20px; }
  .link {
    font-family: var(--mono); font-size: .8rem; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted); text-decoration: none;
    background: none; border: 0; padding: 0; cursor: pointer;
  }
  .link:hover { color: var(--red); }

  .card {
    background: var(--paper-deep);
    border: 1px solid var(--ink);
    border-radius: 6px;
    padding: 28px;
  }
  .card h2 { font-family: var(--serif); font-weight: 400; font-size: 1.6rem; margin: 0 0 6px; }
  .card p.sub { margin: 0 0 22px; color: var(--muted); }

  #auth-view .card { max-width: 440px; margin: 8vh auto 0; }

  label {
    display: block; font-family: var(--mono); font-size: .72rem;
    letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
    margin: 16px 0 6px;
  }
  input[type="text"], input[type="email"], input[type="password"], input[type="url"] {
    width: 100%; padding: 12px 14px; font: inherit; color: var(--ink);
    background: var(--paper); border: 1px solid var(--ink); border-radius: 4px;
  }
  input:focus-visible, button:focus-visible, a:focus-visible {
    outline: 3px solid var(--red); outline-offset: 2px;
  }

  .btn {
    margin-top: 22px; width: 100%; padding: 13px 18px;
    font-family: var(--mono); font-size: .82rem; letter-spacing: .1em;
    text-transform: uppercase; color: var(--paper); background: var(--red);
    border: 1px solid var(--red-dark); border-radius: 4px; cursor: pointer;
  }
  .btn:hover:not(:disabled) { background: var(--red-dark); }
  .btn:disabled { opacity: .6; cursor: wait; }

  .msg {
    margin-top: 16px; padding: 10px 12px; font-size: .92rem;
    border: 1px dashed var(--ink); border-radius: 4px; display: none;
  }
  .msg.show { display: block; }
  .msg.error { color: var(--red-dark); border-color: var(--red); }
  .msg.ok { color: var(--ink); }

  .add-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
  .add-grid .btn { grid-column: 1 / -1; }
  .hint { font-family: var(--mono); font-size: .75rem; color: var(--muted); margin-top: 12px; }

  .list-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin: 48px 0 18px; border-bottom: 1px solid var(--ink); padding-bottom: 8px;
  }
  .list-head h2 { font-family: var(--serif); font-weight: 400; font-size: 1.6rem; margin: 0; }
  .count { font-family: var(--mono); font-size: .8rem; color: var(--muted); }

  .stores { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .store {
    background: var(--paper-deep); border: 1px solid var(--ink); border-radius: 6px;
    padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; min-width: 0;
  }
  .store .tag {
    align-self: flex-start; font-family: var(--mono); font-size: .72rem;
    letter-spacing: .1em; color: var(--muted); border: 1px solid var(--muted);
    border-radius: 3px; padding: 1px 8px;
  }
  .store h3 { font-family: var(--serif); font-weight: 400; font-size: 1.35rem; margin: 0; overflow-wrap: anywhere; }
  .store a.out {
    font-family: var(--mono); font-size: .78rem; color: var(--red);
    text-decoration: none; overflow-wrap: anywhere;
  }
  .store a.out:hover { text-decoration: underline; }
  .store .row {
    margin-top: auto; padding-top: 12px; border-top: 1px dashed var(--ink);
    display: flex; justify-content: flex-end;
  }
  .del {
    font-family: var(--mono); font-size: .75rem; letter-spacing: .1em;
    text-transform: uppercase; color: var(--red-dark); background: none;
    border: 1px solid var(--red-dark); border-radius: 4px; padding: 6px 12px; cursor: pointer;
  }
  .del:hover:not(:disabled) { background: var(--red-dark); color: var(--paper); }
  .del:disabled { opacity: .5; cursor: wait; }
  .ed {
    font-family: var(--mono); font-size: .75rem; letter-spacing: .1em;
    text-transform: uppercase; color: var(--ink); background: none;
    border: 1px solid var(--ink); border-radius: 4px; padding: 6px 12px; cursor: pointer;
  }
  .ed:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
  .ed:disabled { opacity: .5; cursor: wait; }
  .store .row { gap: 10px; }
  .store label { margin: 4px 0 4px; }
  .empty { grid-column: 1 / -1; color: var(--muted); padding: 24px 0; }

  [hidden] { display: none !important; }

  @media (max-width: 640px) {
    .add-grid { grid-template-columns: 1fr; }
    header.top h1 { font-size: 1.5rem; }
    .card { padding: 22px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1>Admin Panel</h1>
    <nav>
      <a class="link" href="index.html">← Main Site</a>
      <button class="link" id="logout-btn" type="button" hidden>Logout</button>
    </nav>
  </header>

  <!-- Login -->
  <section id="auth-view">
    <div class="card">
      <h2>Authentication Required</h2>
      <p class="sub">Sign in with your admin email to manage the directory.</p>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="btn" id="login-btn" type="button">Log In</button>
      <div class="msg" id="auth-msg" role="alert"></div>
    </div>
  </section>

  <!-- Dashboard -->
  <section id="dash-view" hidden>
    <div class="card">
      <h2>Add a store</h2>
      <p class="sub">The filing letter is picked from the store name automatically.</p>
      <div class="add-grid">
        <div>
          <label for="store-name">Store name</label>
          <input id="store-name" type="text" maxlength="80" autocomplete="off">
        </div>
        <div>
          <label for="store-url">Store link / URL</label>
          <input id="store-url" type="url" placeholder="https://" autocomplete="off">
        </div>
        <button class="btn" id="add-btn" type="button">Add Store Entry</button>
      </div>
      <div class="msg" id="add-msg" role="status"></div>
    </div>

    <div class="list-head">
      <h2>Managed stores</h2>
      <span class="count" id="count"></span>
    </div>
    <div class="stores" id="stores"></div>
  </section>

</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
  /* ------------------------------------------------------------------
     CONFIG
     Paste your Project URL and the **anon / public** key here.
     The anon key is designed to be public. Your data is protected by
     Row Level Security (see the SQL in the chat), NOT by hiding this key.
     NEVER paste the service_role key into this file.
  ------------------------------------------------------------------- */
  const _cfg = window.FASHIONVAULT_CONFIG || {};
  const SUPABASE_URL = _cfg.supabaseUrl || "https://ciomyprponquukqigewv.supabase.co";
  const SUPABASE_ANON_KEY = _cfg.supabaseAnonKey || "sb_publishable_bZ8DMrQurgC6BA-YTCRMJQ_RjJeAGN4";

  let sb = null, configError = "";
  try {
    if (!window.supabase) throw new Error("The Supabase library did not load. Check your internet connection and reload.");
    if (SUPABASE_URL.startsWith("YOUR_") || SUPABASE_ANON_KEY.startsWith("YOUR_"))
      throw new Error("Paste your Supabase Project URL and anon public key at the top of the script in admin.html.");
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch (e) {
    configError = e.message;
  }

  const $ = (id) => document.getElementById(id);
  const authView = $("auth-view"), dashView = $("dash-view");
  const logoutBtn = $("logout-btn"), loginBtn = $("login-btn"), addBtn = $("add-btn");

  function say(el, text, type) {
    el.textContent = text;
    el.className = "msg show " + (type || "");
  }
  function clearMsg(el) { el.textContent = ""; el.className = "msg"; }

  /* Filing letter: first letter A-Z (accents stripped), otherwise # */
  function categoryFor(name) {
    const c = name.trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "").charAt(0).toUpperCase();
    return /^[A-Z]$/.test(c) ? c : "#";
  }

  /* Stable id for the main site, e.g. "My Shop!" -> "store-my-shop" */
  function slugFor(name) {
    const s = name.trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    return "store-" + (s || "shop");
  }

  /* Only allow http(s) links, add https:// when missing */
  function cleanUrl(raw) {
    let v = raw.trim();
    if (!v) return null;
    if (!/^[a-z][a-z0-9+.-]*:/i.test(v)) v = "https://" + v;
    try {
      const u = new URL(v);
      return (u.protocol === "http:" || u.protocol === "https:") ? u.href : null;
    } catch { return null; }
  }

  /* ---------- Views ---------- */
  function showAuth() {
    authView.hidden = false; dashView.hidden = true; logoutBtn.hidden = true;
  }
  async function showDash() {
    authView.hidden = true; dashView.hidden = false; logoutBtn.hidden = false;
    await loadStores();
  }

  /* ---------- Auth ---------- */
  async function login() {
    clearMsg($("auth-msg"));
    const email = $("email").value.trim();
    const password = $("password").value;
    if (!email || !password) return say($("auth-msg"), "Enter your email and password.", "error");
    loginBtn.disabled = true;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    loginBtn.disabled = false;
    if (error) return say($("auth-msg"), "Could not log in. Check your email and password.", "error");
    $("password").value = "";
    // onAuthStateChange will switch the view
  }
  async function logout() { await sb.auth.signOut(); }

  loginBtn.addEventListener("click", login);
  $("password").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
  logoutBtn.addEventListener("click", logout);

  /* ---------- Read ---------- */
  async function loadStores() {
    const box = $("stores");
    const { data, error } = await sb.from("stores").select("id, name, url, category");
    box.replaceChildren();
    if (error) {
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = "Could not load stores. " + error.message;
      box.appendChild(p);
      return;
    }
    const rows = (data || []).sort((a, b) =>
      a.name.localeCompare(b.name, undefined, { sensitivity: "base" }));
    $("count").textContent = rows.length + (rows.length === 1 ? " store" : " stores");
    if (!rows.length) {
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = "No stores yet. Add the first one above.";
      box.appendChild(p);
      return;
    }
    rows.forEach((s) => box.appendChild(storeCard(s)));
  }

  function storeCard(s) {
    const card = document.createElement("article");
    card.className = "store";

    const tag = document.createElement("span");
    tag.className = "tag"; tag.textContent = s.category;

    const h = document.createElement("h3");
    h.textContent = s.name;

    const a = document.createElement("a");
    a.className = "out";
    a.textContent = s.url + " ↗";
    const safe = cleanUrl(s.url);
    if (safe) { a.href = safe; a.target = "_blank"; a.rel = "noopener noreferrer"; }

    const row = document.createElement("div");
    row.className = "row";
    const edit = document.createElement("button");
    edit.type = "button"; edit.className = "ed"; edit.textContent = "Edit";
    edit.addEventListener("click", () => card.replaceChildren(...editForm(s)));
    const del = document.createElement("button");
    del.type = "button"; del.className = "del"; del.textContent = "Delete";
    del.addEventListener("click", () => removeStore(s, del));
    row.append(edit, del);

    card.append(tag, h, a, row);
    return card;
  }

  /* ---------- Update ---------- */
  function editForm(s) {
    const l1 = document.createElement("label"); l1.textContent = "Store name";
    const n = document.createElement("input");
    n.type = "text"; n.maxLength = 80; n.value = s.name; n.setAttribute("aria-label", "Store name");
    const l2 = document.createElement("label"); l2.textContent = "Store link / URL";
    const u = document.createElement("input");
    u.type = "text"; u.value = s.url; u.setAttribute("aria-label", "Store link");

    const row = document.createElement("div");
    row.className = "row";
    const cancel = document.createElement("button");
    cancel.type = "button"; cancel.className = "del"; cancel.textContent = "Cancel";
    cancel.addEventListener("click", loadStores);
    const save = document.createElement("button");
    save.type = "button"; save.className = "ed"; save.textContent = "Save";
    save.addEventListener("click", async () => {
      clearMsg($("add-msg"));
      const name = n.value.trim();
      const url = cleanUrl(u.value);
      if (!name) return say($("add-msg"), "Enter a store name.", "error");
      if (!url) return say($("add-msg"), "Enter a valid link, like https://example.com.", "error");
      save.disabled = true;
      const { data, error } = await sb.from("stores")
        .update({ name, url, category: categoryFor(name) })
        .eq("id", s.id).select();
      save.disabled = false;
      if (error || !data || !data.length)
        return say($("add-msg"), "Could not save changes. Check the admin update policy in Supabase.", "error");
      say($("add-msg"), "Saved " + name + ".", "ok");
      await loadStores();
    });
    row.append(cancel, save);
    return [l1, n, l2, u, row];
  }

  /* ---------- Create ---------- */
  async function addStore() {
    clearMsg($("add-msg"));
    const name = $("store-name").value.trim();
    const url = cleanUrl($("store-url").value);
    if (!name) return say($("add-msg"), "Enter a store name.", "error");
    if (!url) return say($("add-msg"), "Enter a valid link, like https://example.com.", "error");

    addBtn.disabled = true;
    const { error } = await sb.from("stores").insert({ name, url, category: categoryFor(name), slug: slugFor(name), is_approved: true });
    addBtn.disabled = false;
    if (error) return say($("add-msg"), "Could not add the store. " + error.message, "error");

    $("store-name").value = ""; $("store-url").value = "";
    say($("add-msg"), "Added " + name + " under " + categoryFor(name) + ".", "ok");
    await loadStores();
  }
  addBtn.addEventListener("click", addStore);
  ["store-name", "store-url"].forEach((id) =>
    $(id).addEventListener("keydown", (e) => { if (e.key === "Enter") addStore(); }));

  /* ---------- Delete ---------- */
  async function removeStore(s, btn) {
    if (!confirm("Delete " + s.name + "? This cannot be undone.")) return;
    btn.disabled = true;
    const { data, error } = await sb.from("stores").delete().eq("id", s.id).select();
    if (error || !data || !data.length) {
      btn.disabled = false;
      return say($("add-msg"), "Could not delete " + s.name + ". Check the admin delete policy in Supabase.", "error");
    }
    say($("add-msg"), "Deleted " + s.name + ".", "ok");
    await loadStores();
  }

  /* ---------- Boot ---------- */
  if (!sb) {
    showAuth();
    loginBtn.disabled = true;
    say($("auth-msg"), configError, "error");
  } else {
    sb.auth.onAuthStateChange((_event, session) => {
      // Defer so we never await Supabase calls inside the auth callback
      setTimeout(() => { session ? showDash() : showAuth(); }, 0);
    });
    sb.auth.getSession().then(({ data }) => { data.session ? showDash() : showAuth(); })
      .catch(() => showAuth());
  }
</script>
</body>
</html>
