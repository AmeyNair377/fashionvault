<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Admin Panel - Fashion Vault</title>
    <!-- Supabase Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --border: #334155;
            --danger: #ef4444;
            --danger-hover: #dc2626;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        header h1 {
            font-size: 1.5rem;
            margin: 0;
        }

        .header-actions {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .nav-link {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .nav-link:hover {
            text-decoration: underline;
        }

        .btn-logout {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.4rem 0.8rem;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-logout:hover {
            color: var(--text-color);
            border-color: var(--text-muted);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            color: var(--text-color);
            font-size: 1rem;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
        }

        button.btn {
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            border-radius: 0.5rem;
            padding: 0.75rem 1.25rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        button.btn:hover {
            background-color: var(--accent-hover);
        }

        .store-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            margin-bottom: 0.75rem;
        }

        .store-info {
            display: flex;
            flex-direction: column;
        }

        .store-name {
            font-weight: 600;
        }

        .store-category {
            font-size: 0.75rem;
            color: var(--accent);
            background-color: rgba(56, 189, 248, 0.1);
            padding: 0.15rem 0.4rem;
            border-radius: 0.25rem;
            width: fit-content;
            margin-top: 0.25rem;
        }

        .store-link {
            font-size: 0.875rem;
            color: var(--text-muted);
            text-decoration: none;
            margin-top: 0.15rem;
        }

        .store-link:hover {
            text-decoration: underline;
        }

        .btn-danger {
            background-color: var(--danger);
            color: #ffffff;
            border: none;
            border-radius: 0.375rem;
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-danger:hover {
            background-color: var(--danger-hover);
        }

        .status-msg {
            margin-top: 1rem;
            font-size: 0.875rem;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- HEADER WITH MAIN SITE LINK -->
        <header>
            <h1>Admin Panel</h1>
            <div class="header-actions">
                <a href="index.html" class="nav-link">&larr; Go to Main Site</a>
                <button id="logout-btn" class="btn-logout hidden">Logout</button>
            </div>
        </header>

        <!-- SECTION 1: LOGIN FORM (Shown when logged out) -->
        <div id="login-section" class="card">
            <h2>Admin Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" placeholder="admin@example.com" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn">Log In</button>
            </form>
            <div id="login-status" class="status-msg"></div>
        </div>

        <!-- SECTION 2: ADMIN CONTENT (Hidden until logged in) -->
        <div id="admin-content" class="hidden">
            <div class="card">
                <h2>Add New Store</h2>
                <form id="store-form">
                    <div class="form-group">
                        <label for="store-name">Store Name</label>
                        <input type="text" id="store-name" placeholder="e.g. Zara" required>
                    </div>
                    <div class="form-group">
                        <label for="store-link">Store Link / URL</label>
                        <input type="url" id="store-link" placeholder="https://example.com" required>
                    </div>
                    <button type="submit" class="btn">Add Store</button>
                </form>
                <div id="add-status" class="status-msg"></div>
            </div>

            <div class="store-list-container">
                <h2>Existing Stores</h2>
                <div id="stores-list">
                    <p style="color: var(--text-muted); text-align: center;">Loading stores...</p>
                </div>
            </div>
        </div>

    </div>

    <script>
        // CONFIGURATION - Replace with your project details
        const SUPABASE_URL = '';
        const SUPABASE_ANON_KEY = '';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // UI Elements
        const loginSection = document.getElementById('login-section');
        const adminContent = document.getElementById('admin-content');
        const loginForm = document.getElementById('login-form');
        const loginStatus = document.getElementById('login-status');
        const logoutBtn = document.getElementById('logout-btn');

        const storeForm = document.getElementById('store-form');
        const storeNameInput = document.getElementById('store-name');
        const storeLinkInput = document.getElementById('store-link');
        const addStatus = document.getElementById('add-status');
        const storesListEl = document.getElementById('stores-list');

        // Extract category letter (A-Z or #)
        function getCategoryLetter(name) {
            if (!name) return '#';
            const firstChar = name.trim().charAt(0).toUpperCase();
            return (firstChar >= 'A' && firstChar <= 'Z') ? firstChar : '#';
        }

        // --- AUTHENTICATION HANDLERS ---

        // Check active session on load
        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            toggleUI(session);
        }

        // Toggle views based on auth state
        function toggleUI(session) {
            if (session) {
                loginSection.classList.add('hidden');
                adminContent.classList.remove('hidden');
                logoutBtn.classList.remove('hidden');
                fetchStores();
            } else {
                loginSection.classList.remove('hidden');
                adminContent.classList.add('hidden');
                logoutBtn.classList.add('hidden');
            }
        }

        // Handle Login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginStatus.textContent = 'Logging in...';
            loginStatus.style.color = 'var(--text-muted)';

            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                loginStatus.style.color = 'var(--danger)';
                loginStatus.textContent = error.message;
            } else {
                loginStatus.textContent = '';
                toggleUI(data.session);
            }
        });

        // Handle Logout
        logoutBtn.addEventListener('click', async () => {
            await supabase.auth.signOut();
            toggleUI(null);
        });

        // --- STORE MANAGEMENT HANDLERS ---

        async function fetchStores() {
            try {
                const { data, error } = await supabase
                    .from('stores')
                    .select('*')
                    .order('name', { ascending: true });

                if (error) throw error;

                if (!data || data.length === 0) {
                    storesListEl.innerHTML = '<p style="color: var(--text-muted); text-align: center;">No stores added yet.</p>';
                    return;
                }

                storesListEl.innerHTML = '';
                data.forEach(store => {
                    const item = document.createElement('div');
                    item.className = 'store-item';
                    
                    item.innerHTML = `
                        <div class="store-info">
                            <span class="store-name">${escapeHtml(store.name)}</span>
                            <a href="${escapeHtml(store.link)}" target="_blank" class="store-link">${escapeHtml(store.link)}</a>
                            <span class="store-category">Category: ${escapeHtml(store.category || getCategoryLetter(store.name))}</span>
                        </div>
                        <button class="btn-danger" onclick="deleteStore('${store.id}')">Delete</button>
                    `;
                    storesListEl.appendChild(item);
                });

            } catch (err) {
                storesListEl.innerHTML = '<p style="color: var(--danger); text-align: center;">Failed to load stores.</p>';
            }
        }

        storeForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            addStatus.textContent = '';
            
            const name = storeNameInput.value.trim();
            const link = storeLinkInput.value.trim();
            const category = getCategoryLetter(name);

            try {
                const { error } = await supabase
                    .from('stores')
                    .insert([{ name, link, category }]);

                if (error) throw error;

                addStatus.style.color = '#34d399';
                addStatus.textContent = 'Store added successfully!';
                storeForm.reset();
                fetchStores();
            } catch (err) {
                addStatus.style.color = 'var(--danger)';
                addStatus.textContent = 'Error: ' + err.message;
            }
        });

        window.deleteStore = async function(id) {
            if (!confirm('Are you sure you want to delete this store?')) return;

            try {
                const { error } = await supabase
                    .from('stores')
                    .delete()
                    .eq('id', id);

                if (error) throw error;
                fetchStores();
            } catch (err) {
                alert('Failed to delete store: ' + err.message);
            }
        };

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Check login state when page loads
        checkSession();
    </script>
</body>
</html>
